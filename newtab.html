<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <title>待读 · 新标签页</title>
    <link rel="icon" href="icons/icon48.png">
    <link rel="stylesheet" href="newtab.css">
    <link rel="stylesheet" href="bookmark-bar.css">
    <script type="module" src="newtab.js"></script>
  </head>
  <body>
    <nav id="bookmark-bar" class="bookmark-bar" aria-label="书签栏" hidden>
      <div id="bookmark-bar-items" class="bookmark-bar-items"></div>
      <button id="bookmark-overflow" class="bar-entry bar-overflow" type="button" aria-label="更多书签" aria-haspopup="menu" aria-expanded="false" hidden>»</button>
      <p id="bookmark-bar-error" class="bookmark-bar-error" role="alert" hidden></p>
    </nav>
    <div id="bookmark-menu" class="bookmark-menu" role="menu" tabindex="-1" hidden></div>
    <p id="bookmark-bar-status" class="sr-only" role="status" aria-live="polite"></p>
    <div class="page">
      <header class="page-header">
        <nav aria-label="常用网站">
          <ul id="shortcut-list" class="shortcut-list"></ul>
        </nav>
      </header>

      <main>
        <section class="inbox" aria-labelledby="inbox-title" aria-busy="true">
          <div class="inbox-heading">
            <div>
              <p class="eyebrow">BOOKMARK INBOX</p>
              <div class="title-line">
                <h1 id="inbox-title">待阅读</h1>
                <span id="bookmark-count" class="count" hidden></span>
              </div>
            </div>
            <button class="manage-link" type="button">
              管理书签
              <svg aria-hidden="true" viewBox="0 0 16 16" fill="none"><path d="M4 12 12 4M4.5 4H12v7.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </button>
          </div>

          <div class="list-heading" aria-hidden="true">
            <div class="column-heading"><span>未归档的网页</span><span>收藏日期</span></div>
            <div class="column-heading"><span>未归档的网页</span><span>收藏日期</span></div>
          </div>

          <p id="load-status" class="sr-only" role="status" aria-live="polite">正在读取书签</p>
          <div id="loading" class="loading" aria-hidden="true">
            <div class="skeleton-row"><span></span><div><i></i><i></i></div></div>
            <div class="skeleton-row"><span></span><div><i></i><i></i></div></div>
            <div class="skeleton-row"><span></span><div><i></i><i></i></div></div>
          </div>

          <ul id="bookmark-list" class="bookmark-list" aria-label="待阅读的书签" hidden></ul>

          <div id="state" class="state" hidden>
            <span class="state-icon" aria-hidden="true">
              <svg viewBox="0 0 48 48" fill="none"><path d="M12 9h24v31L24 32l-12 8V9Z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/><path d="m18 20 4 4 8-8" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </span>
            <h2 id="state-title"></h2>
            <p id="state-description"></p>
            <button id="retry" type="button" hidden>重新读取</button>
          </div>

          <footer class="inbox-footer">
            <span class="source"><span class="source-dot" aria-hidden="true"></span>来自书签栏</span>
            <span>拖入顶部分类文件夹后，自动从这里移除</span>
          </footer>
        </section>
      </main>
    </div>

    <dialog id="shortcut-dialog" aria-labelledby="shortcut-dialog-title">
      <form id="shortcut-form">
        <h2 id="shortcut-dialog-title">添加快捷方式</h2>
        <label for="shortcut-title">名称</label>
        <input id="shortcut-title" name="title" type="text" maxlength="80" required autocomplete="off">
        <label for="shortcut-url">网址</label>
        <input id="shortcut-url" name="url" type="text" inputmode="url" required autocomplete="off" spellcheck="false" placeholder="https://example.com">
        <p id="shortcut-error" class="shortcut-error" role="alert" hidden></p>
        <div class="dialog-actions">
          <button id="delete-shortcut" class="delete-shortcut" type="button" hidden>删除</button>
          <span class="dialog-spacer"></span>
          <button id="cancel-shortcut" type="button">取消</button>
          <button id="save-shortcut" class="primary-button" type="submit">保存</button>
        </div>
      </form>
    </dialog>

    <template id="shortcut-template">
      <li class="shortcut-item">
        <a class="shortcut-link" rel="noreferrer noopener">
          <span class="shortcut-icon" aria-hidden="true">
            <svg class="favicon-fallback" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="8" stroke="currentColor" stroke-width="1.3"/><path d="M4 12h16M12 4c4 4 4 12 0 16-4-4-4-12 0-16Z" stroke="currentColor" stroke-width="1.3"/></svg>
            <img class="favicon" alt="" width="24" height="24" hidden>
          </span>
          <span class="shortcut-label"></span>
        </a>
        <button class="edit-shortcut" type="button">
          <svg aria-hidden="true" viewBox="0 0 16 16" fill="currentColor"><circle cx="8" cy="3" r="1.3"/><circle cx="8" cy="8" r="1.3"/><circle cx="8" cy="13" r="1.3"/></svg>
        </button>
      </li>
    </template>

    <template id="bookmark-template">
      <li class="bookmark-item">
        <a class="bookmark-link" rel="noreferrer noopener">
          <span class="favicon-frame" aria-hidden="true">
            <svg class="favicon-fallback" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="8" stroke="currentColor" stroke-width="1.3"/><path d="M4 12h16M12 4c4 4 4 12 0 16-4-4-4-12 0-16Z" stroke="currentColor" stroke-width="1.3"/></svg>
            <img class="favicon" alt="" width="20" height="20" hidden>
          </span>
          <span class="bookmark-content">
            <span class="bookmark-title" dir="auto"></span>
            <span class="bookmark-domain" dir="auto"></span>
          </span>
          <time class="bookmark-date"></time>
          <svg class="open-arrow" aria-hidden="true" viewBox="0 0 20 20" fill="none"><path d="M4 10h12m-5-5 5 5-5 5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </a>
      </li>
    </template>
  </body>
</html>
